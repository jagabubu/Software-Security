<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Audit log</title></head>
<body>
<h1>Audit log (latest 100 events)</h1>
<table border="1" cellpadding="6">
    <tr><th>Time</th><th>User</th><th>Action</th><th>Target</th><th>Outcome</th></tr>
    <tr th:each="e : ${events}">
        <td th:text="${e.eventTime}"></td>
        <td th:text="${e.username}"></td>
        <td th:text="${e.action}"></td>
        <td th:text="${e.target}"></td>
        <td th:text="${e.outcome}"></td>
    </tr>
</table>
<p><a th:href="@{/admin/users}">User accounts</a> | <a th:href="@{/}">Home</a></p>
</body>
</html>
