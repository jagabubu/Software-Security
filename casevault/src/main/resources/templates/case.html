<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Cases</title></head>
<body>
<h1>Cases</h1>
<p><a th:href="@{/cases/new}">Report a new incident</a></p>

<table border="1" cellpadding="6">
    <tr><th>ID</th><th>Title</th><th>Severity</th><th>Status</th></tr>
    <tr th:each="c : ${cases}">
        <td th:text="${c.id}"></td>
        <td><a th:href="@{/cases/{id}(id=${c.id})}" th:text="${c.title}"></a></td>
        <td th:text="${c.severity}"></td>
        <td th:text="${c.status}"></td>
    </tr>
</table>

<form th:action="@{/logout}" method="post"><button type="submit">Log out</button></form>
</body>
</html>
